# ─────────────────────────────────────────────────────────────────────
# UNSW IoT Device Identification — Pre-training Configuration
# Phase 1: Masked Feature Modeling (ET-BERT style)
# ─────────────────────────────────────────────────────────────────────
base:
  # Data
  data_dir: ../dataset
  min_flows_per_device: 100

  # Windowing
  window_size: 10
  stride: 5

  # Model architecture (Transformer Encoder)
  model_type: transformer
  d_model: 128
  nhead: 4
  num_layers: 4
  dropout: 0.15
  mask_ratio: 0.15

  # Training
  mode: pretrain
  batch_size: 64
  num_epochs: 20
  lr: 1e-3

  # Features from UNSW-IoTraffic flows
  features:
    - srcNumPackets
    - dstNumPackets
    - srcPayloadSize
    - dstPayloadSize
    - srcAvgPayloadSize
    - dstAvgPayloadSize
    - srcMaxPayloadSize
    - dstMaxPayloadSize
    - srcStdDevPayloadSize
    - dstStdDevPayloadSize
    - flowDuration
    - srcAvgInterarrivalTime
    - dstAvgInterarrivalTime
    - avgInterarrivalTime
    - srcStdDevInterarrivalTime
    - dstStdDevInterarrivalTime
    - stdDevInterarrivalTime

runs:
