# ─────────────────────────────────────────────────────────────────────
# UNSW IoT Device Identification — Fine-tuning Configuration
# Phase 3: Supervised Classification (with pre-trained backbone)
# ─────────────────────────────────────────────────────────────────────
base:
  # Data
  data_dir: ../dataset
  min_flows_per_device: 100

  # Windowing
  window_size: 10
  stride: 5

  # Model architecture
  model_type: transformer
  d_model: 128
  nhead: 4
  num_layers: 4
  dropout: 0.15

  # Fine-tuning
  mode: finetune
  batch_size: 64
  num_epochs: 30
  lr: 1e-4
  freeze_encoder: false
  train_ratio: 0.8  # Train/Val split ratio

  # Pre-trained weights source
  pretrain_experiment_id: null  # Set to load contrastive/MLM encoder weights

  # Features
  features:
    - srcNumPackets
    - dstNumPackets
    - srcPayloadSize
    - dstPayloadSize
    - srcAvgPayloadSize
    - dstAvgPayloadSize
    - srcMaxPayloadSize
    - dstMaxPayloadSize
    - srcStdDevPayloadSize
    - dstStdDevPayloadSize
    - flowDuration
    - srcAvgInterarrivalTime
    - dstAvgInterarrivalTime
    - avgInterarrivalTime
    - srcStdDevInterarrivalTime
    - dstStdDevInterarrivalTime
    - stdDevInterarrivalTime

runs:
  # Final model using the best pre-trained backbone
#  - name: finetune_d256
#    experiment_id: finetune_d256
#    overrides:
#      d_model: 256
#      nhead: 8
#      pretrain_experiment_id: contrastive_ntxent_d256

  - name: finetune_robust
    experiment_id: finetune_robust
    overrides:
      d_model: 128
      nhead: 4
      dropout: 0.25
      pretrain_experiment_id: contrastive_robust

  - name: finetune_robust_frozen
    experiment_id: finetune_robust_frozen
    overrides:
      d_model: 128
      nhead: 4
      dropout: 0.25
      freeze_encoder: true
      pretrain_experiment_id: contrastive_robust
