batch_size: 64
d_model: 256
data_dir: ../dataset
dropout: 0.15
experiment_id: finetune_d256
features:
- srcNumPackets
- dstNumPackets
- srcPayloadSize
- dstPayloadSize
- srcAvgPayloadSize
- dstAvgPayloadSize
- srcMaxPayloadSize
- dstMaxPayloadSize
- srcStdDevPayloadSize
- dstStdDevPayloadSize
- flowDuration
- srcAvgInterarrivalTime
- dstAvgInterarrivalTime
- avgInterarrivalTime
- srcStdDevInterarrivalTime
- dstStdDevInterarrivalTime
- stdDevInterarrivalTime
freeze_encoder: false
lr: 1e-4
min_flows_per_device: 100
mode: finetune
model_type: transformer
nhead: 8
num_epochs: 30
num_layers: 4
pretrain_experiment_id: contrastive_ntxent_d256
stride: 5
train_ratio: 0.8
window_size: 10
