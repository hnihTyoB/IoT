batch_size: 64
d_model: 128
data_dir: ../dataset
dropout: 0.25
experiment_id: finetune_robust_frozen
features:
- srcNumPackets
- dstNumPackets
- srcPayloadSize
- dstPayloadSize
- srcAvgPayloadSize
- dstAvgPayloadSize
- srcMaxPayloadSize
- dstMaxPayloadSize
- srcStdDevPayloadSize
- dstStdDevPayloadSize
- flowDuration
- srcAvgInterarrivalTime
- dstAvgInterarrivalTime
- avgInterarrivalTime
- srcStdDevInterarrivalTime
- dstStdDevInterarrivalTime
- stdDevInterarrivalTime
freeze_encoder: true
lr: 1e-4
min_flows_per_device: 100
mode: finetune
model_type: transformer
nhead: 4
num_epochs: 30
num_layers: 4
pretrain_experiment_id: contrastive_robust
stride: 5
train_ratio: 0.8
window_size: 10
